services:
  modern-erp:
    build:
      context: .
      dockerfile: Dockerfile
    image: modern-erp:latest
    container_name: modern-erp
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - ERP_DATA_DIR=/app/data
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-ledgerly-secret-change-in-production-random-key-64chars}
      - APP_DOMAIN=${APP_DOMAIN:-erp-portal.rapidtss.com}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://${APP_DOMAIN:-erp-portal.rapidtss.com}}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-https://erp-portal.rapidtss.com,http://erp-portal.rapidtss.com,http://84.235.255.173,https://84.235.255.173,http://localhost:3000,http://localhost}
      - SETUP_KEY=${SETUP_KEY}
    volumes:
      - /opt/modern-erp/data:/app/data
    networks:
      - erp-network

  caddy:
    image: caddy:2-alpine
    container_name: erp-caddy
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-erp-portal.rapidtss.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - modern-erp
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
