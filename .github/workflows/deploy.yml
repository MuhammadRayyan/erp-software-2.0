name: Verify and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_revision:
        description: "Roll back: full 40-character commit SHA of an earlier main release. Leave empty to verify and deploy the selected branch."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verify-and-deploy-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks and unit tests
    if: ${{ !inputs.rollback_revision }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Validate CI and deployment failure recovery
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color -shellcheck=
          bash -n scripts/deploy.sh scripts/deploy-from-ci.sh scripts/ci-image-smoke.sh
          bash scripts/test-deployment-flow.sh
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # puppeteer-core ships no browser; the HTML PDF unit test renders with Playwright's Chromium.
      - name: Install Chromium for PDF rendering tests
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:permissions
      - name: Drizzle schema matches freshly migrated databases
        run: npm run check:schema
      - name: Production dependency security check
        run: node --import tsx scripts/check-prod-audit.ts

  # The browser suite is split across parallel shards; each builds the app and
  # runs its share of the spec files against its own disposable server.
  browser:
    name: Browser tests (shard ${{ matrix.shard }}/4)
    if: ${{ !inputs.rollback_revision }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Production build for browser verification
        env:
          NEXT_DIST_DIR: .next-validate
          NEXT_PHASE: phase-production-build
          ERP_DATA_DIR: ${{ runner.temp }}/erp-build
        run: |
          npm run build:ops
          node .ops/ops.cjs migrate
          npm run build
      - name: Browser workflow and permission verification
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: |
            test-results/browser
            test-results/acceptance
          if-no-files-found: ignore
          retention-days: 3

  # Branch protection requires this check name. It passes only when every
  # parallel verification job passed (a skipped or failed job fails it).
  verify:
    name: Verify source and financial regressions
    needs: [static, browser]
    if: ${{ !cancelled() && !inputs.rollback_revision }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "static=$STATIC browser=$BROWSER"
          [[ "$STATIC" == success && "$BROWSER" == success ]]

  image:
    name: Verify ARM64 production image
    needs: verify
    if: ${{ !inputs.rollback_revision }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the exact checked-out release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          provenance: false
          tags: erp-verified:${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          # Layer cache: written only by main (PR caches are visible to that PR alone,
          # so exporting them costs minutes for nothing); every run reads main's.
          cache-from: type=gha,scope=erp-image-arm64
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=erp-image-arm64,mode=max' || '' }}
      - name: Test the final production image
        run: bash scripts/ci-image-smoke.sh erp-verified:"$GITHUB_SHA" "$GITHUB_SHA"
      - name: Extract release metadata and production dependency inventory
        run: |
          mkdir -p release-evidence
          docker run --rm --entrypoint cat erp-verified:"$GITHUB_SHA" tools/release.json > release-evidence/release.json
          docker run --rm --entrypoint cat erp-verified:"$GITHUB_SHA" tools/production-dependencies.cdx.json > release-evidence/production-dependencies.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
          retention-days: 30
      - name: Publish verified immutable release
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag erp-verified:"$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          digest="$(docker image inspect "$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  deploy:
    name: Deploy and verify production
    needs: [verify, image]
    # A normal release needs verified jobs; a manual rollback skips straight to
    # deploying an image that an earlier main run already verified and published.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.rollback_revision
          && needs.verify.result == 'success' && needs.image.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.rollback_revision)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
      RELEASE_REVISION: ${{ inputs.rollback_revision || github.sha }}
      ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
      VERIFIED_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A rollback ships that release's own compose file, Caddyfile and deploy scripts,
          # and needs full history to confirm the revision is on main.
          ref: ${{ env.RELEASE_REVISION }}
          fetch-depth: ${{ inputs.rollback_revision && '0' || '1' }}
      - name: Resolve the release image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$ROLLBACK_REVISION" ]]; then
            echo "RELEASE_IMAGE=$VERIFIED_IMAGE" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ "$ROLLBACK_REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo "rollback_revision must be a full 40-character commit SHA" >&2; exit 1; }
          git merge-base --is-ancestor "$ROLLBACK_REVISION" origin/main || { echo "Only revisions already on main can be rolled back to" >&2; exit 1; }
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest="$(docker buildx imagetools inspect "$repository:$ROLLBACK_REVISION" --format '{{json .Manifest}}' | jq -r .digest)"
          docker logout ghcr.io
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "No published image for $ROLLBACK_REVISION" >&2; exit 1; }
          echo "Rolling back to $ROLLBACK_REVISION ($repository@$digest)"
          echo "RELEASE_IMAGE=$repository@$digest" >> "$GITHUB_ENV"
      - name: Validate deployment configuration
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_KNOWN_HOSTS" && test -n "$RELEASE_IMAGE"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/erp_deploy
          chmod 600 ~/.ssh/erp_deploy
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage exact revision and deploy by digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i "$HOME/.ssh/erp_deploy")
          destination="$SERVER_USER@$SERVER_HOST"
          ssh "${options[@]}" "$destination" "umask 077; mkdir -p /opt/modern-erp/releases/$RELEASE_REVISION"
          scp "${options[@]}" scripts/deploy.sh scripts/deploy-from-ci.sh docker-compose.yml Caddyfile "$destination:/opt/modern-erp/releases/$RELEASE_REVISION/"
          # A job-scoped token is streamed to a private temporary Docker config; it is never stored on the host permanently.
          printf '%s' "$REGISTRY_TOKEN" | ssh "${options[@]}" "$destination" "bash /opt/modern-erp/releases/$RELEASE_REVISION/deploy-from-ci.sh '$RELEASE_REVISION' '$RELEASE_IMAGE' '$GITHUB_ACTOR'"
      - name: Remove runner SSH material
        if: always()
        run: rm -f -- ~/.ssh/erp_deploy
