name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - pdf-view-update
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test Suite (248 Tests)
        run: npm test

  deploy:
    name: Deploy to Oracle Cloud VM
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pdf-view-update')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: env.SERVER_HOST != '' && env.SSH_PRIVATE_KEY != ''
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/modern-erp
            git pull origin ${{ github.ref_name }}
            docker compose build modern-erp
            docker compose up -d
            docker image prune -f
            sleep 5
            curl -f http://localhost:3000/api/health || exit 1
            echo "==> Modern ERP successfully deployed and verified!"
