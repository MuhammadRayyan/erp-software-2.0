name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  verify:
    name: Lint, Typecheck & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test Suite (312 Tests)
        run: npm test

  deploy:
    name: Deploy to Oracle Cloud VM
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Deploy via SSH
        if: env.SERVER_HOST != '' && env.SSH_PRIVATE_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/modern-erp
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose build modern-erp
            docker compose stop modern-erp
            mkdir -p /home/ubuntu/backups
            tar -czf /home/ubuntu/backups/backup_$(date +%Y%m%d_%H%M%S).tar.gz -C /opt/modern-erp data
            docker compose up -d
            docker image prune -f
            sleep 8
            for i in 1 2 3 4 5 6; do
              if curl -f -s http://localhost/api/health; then
                echo "Healthcheck passed on attempt $i"
                break
              fi
              echo "Waiting for healthcheck to pass... ($i/6)"
              sleep 4
            done
            curl -f http://localhost/api/health || exit 1
            echo "==> Modern ERP successfully deployed and verified!"
