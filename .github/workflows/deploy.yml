name: Verify and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-and-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify source and financial regressions
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Validate CI and deployment failure recovery
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color -shellcheck=
          bash -n scripts/deploy.sh scripts/deploy-from-ci.sh scripts/ci-image-smoke.sh
          bash scripts/test-deployment-flow.sh
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:permissions
      - name: Production dependency security check
        run: npm audit --omit=dev --audit-level=high
      - name: Production build for browser verification
        env:
          NEXT_DIST_DIR: .next-validate
          NEXT_PHASE: phase-production-build
          ERP_DATA_DIR: ${{ runner.temp }}/erp-build
        run: |
          npm run build:ops
          node .ops/ops.cjs migrate
          npm run build
      - name: Browser workflow and permission verification
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: test-results/acceptance
          if-no-files-found: ignore
          retention-days: 3

  image:
    name: Verify ARM64 production image
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the exact checked-out release
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" --tag erp-verified:"$GITHUB_SHA" .
      - name: Test the final production image
        run: bash scripts/ci-image-smoke.sh erp-verified:"$GITHUB_SHA" "$GITHUB_SHA"
      - name: Extract release metadata and production dependency inventory
        run: |
          mkdir -p release-evidence
          docker run --rm --entrypoint cat erp-verified:"$GITHUB_SHA" tools/release.json > release-evidence/release.json
          docker run --rm --entrypoint cat erp-verified:"$GITHUB_SHA" tools/production-dependencies.cdx.json > release-evidence/production-dependencies.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
          retention-days: 30
      - name: Publish verified immutable release
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag erp-verified:"$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          digest="$(docker image inspect "$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  deploy:
    name: Deploy and verify production
    needs: [verify, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
      RELEASE_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deployment configuration
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_KNOWN_HOSTS" && test -n "$RELEASE_IMAGE"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/erp_deploy
          chmod 600 ~/.ssh/erp_deploy
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage exact revision and deploy by digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i "$HOME/.ssh/erp_deploy")
          destination="$SERVER_USER@$SERVER_HOST"
          ssh "${options[@]}" "$destination" "umask 077; mkdir -p /opt/modern-erp/releases/$GITHUB_SHA"
          scp "${options[@]}" scripts/deploy.sh scripts/deploy-from-ci.sh docker-compose.yml Caddyfile "$destination:/opt/modern-erp/releases/$GITHUB_SHA/"
          # A job-scoped token is streamed to a private temporary Docker config; it is never stored on the host permanently.
          printf '%s' "$REGISTRY_TOKEN" | ssh "${options[@]}" "$destination" "bash /opt/modern-erp/releases/$GITHUB_SHA/deploy-from-ci.sh '$GITHUB_SHA' '$RELEASE_IMAGE' '$GITHUB_ACTOR'"
      - name: Remove runner SSH material
        if: always()
        run: rm -f -- ~/.ssh/erp_deploy
