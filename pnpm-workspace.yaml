allowBuilds:
  better-sqlite3: true
  canvas: false
  core-js: false
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tanstack/react-table@9.1.0'
  - '@tanstack/table-core@9.1.0'
  - eslint@9.39.5
  - react-hook-form@7.85.0
# Keep the complete pdfme family on the verified browser-compatible release.
# See docs/PDFME_PHASE_0_FINDINGS.md before upgrading to v6.
overrides:
  '@pdfme/common': 5.5.10
  '@pdfme/converter': 5.5.10
  '@pdfme/generator': 5.5.10
  '@pdfme/pdf-lib': 5.5.10
  '@pdfme/schemas': 5.5.10
  '@pdfme/ui': 5.5.10
